{% extends "admin/change_form.html" %}
{% load i18n admin_urls static admin_modify %}

{% block extrahead %}
  {{ block.super }}
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
  <link rel="stylesheet" type="text/css" href="{% static 'test-management/css/test_suite_form.css' %}">
{% endblock %}

{% block admin_change_form_document_ready %}
  {{ block.super }}

  <!-- Inject category filter manually -->
  <!-- <script type="text/javascript">
    window.testCategories = {{ categories|safe }}
  </script> -->

  <!-- Existing selected test cases -->
  <script id="existing-test-cases-data" type="application/json">
    {% if selected_test_cases_with_order %}
      {{ selected_test_cases_with_order|safe }}
    {% else %}
      []
    {% endif %}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const categorySelect = document.getElementById('category-filter');
      if (categorySelect) {
        new Choices(categorySelect, {
          removeItemButton: true,
          searchEnabled: true,
          placeholder: true,
          placeholderValue: 'Select Categories',
          noResultsText: 'No categories found',
          itemSelectText: 'Select',
          shouldSort: false,
        });
      }
    });
  </script>
  


  <script src="{% static 'test-management/js/test_suite_form.js' %}"></script>
{% endblock %}


 {% block after_field_sets %}

  <div class="custom-category-filter">
    <div class="category-filter-input">
        <label >Filter by Category:</label>
        <select id="category-filter" class="vSelect" multiple >
            <option value="__all__">Select All</option>
            {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
        </select>
    </div>
    
    <button type="button" id="apply-category-filter" class="button btn btn-primary">Apply</button>
  </div>
  <div class="field-category"></div>
{% endblock %}
