<style>
/* Modal Overlay */
.modal {
  position: fixed;
  z-index: 10000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
}

.modal-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(2px);
}

/* Modal Dialog */
.modal-dialog {
  position: relative;
  width: 90%;
  max-width: 500px;
  margin: 100px auto;
  z-index: 10001;
}

/* Modal Content */
.modal-content {
  background-color: #fff;
  border-radius: 4px;
  box-shadow: 0 2px 15px rgba(0, 0, 0, 0.3);
  overflow: hidden;
}

/* Modal Header */
.modal-header {
  background-color: #007cba;
  color: #fff;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #2b5468;
}

.modal-header h2 {
  margin: 0;
  font-size: 18px;
  font-weight: 400;
  color: #fff;
}

.modal-header .close {
  background: none;
  border: none;
  color: #fff;
  font-size: 28px;
  font-weight: 300;
  line-height: 1;
  cursor: pointer;
  padding: 0;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 3px;
  transition: background-color 0.2s;
}

.modal-header .close:hover {
  background-color: rgba(255, 255, 255, 0.1);
}

/* Modal Body */
.modal-body {
  padding: 20px;
  background-color: #f9f9f9;
}

.form-row {
  margin-bottom: 0;
}

.form-group {
  margin-bottom: 15px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
  color: #333;
  font-size: 13px;
}

.form-group label.required:after {
  content: "*";
  color: #ba2121;
  margin-left: 4px;
}

.form-group input[type="datetime-local"] {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 14px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  box-sizing: border-box;
  transition: all 0.2s;
  background-color: #fff;
  color: #333;
  line-height: 1.5;
}
.form-group input[type="datetime-local"]:hover {
  border-color: #999;
}
.form-group input[type="datetime-local"]:focus {
  outline: none;
  border-color: #417690;
  box-shadow: 0 0 0 3px rgba(65, 118, 144, 0.1);
    background-color: #fff;
}
.form-group input[type="datetime-local"].error {
  border-color: #ba2121;
  background-color: #fff5f5;
}

.form-group input[type="datetime-local"].error:focus {
  border-color: #ba2121;
  box-shadow: 0 0 0 3px rgba(186, 33, 33, 0.1);
}

/* DateTime picker icon styling */
.form-group input[type="datetime-local"]::-webkit-calendar-picker-indicator {
  cursor: pointer;
  padding: 4px;
  border-radius: 3px;
  transition: background-color 0.2s;
}

.form-group input[type="datetime-local"]::-webkit-calendar-picker-indicator:hover {
  background-color: rgba(65, 118, 144, 0.1);
}

/* Error Message Styling */
.error-message {
  margin: 8px 0 0 0;
  padding: 8px 12px;
  background-color: #fff5f5;
  border: 1px solid #fdd;
  border-left: 3px solid #ba2121;
  border-radius: 3px;
  color: #ba2121;
  font-size: 12px;
  line-height: 1.4;
  display: flex;
  align-items: center;
  gap: 6px;
  animation: slideIn 0.3s ease-out;
}

.error-icon {
  font-size: 14px;
  flex-shrink: 0;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(-5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.form-group .help {
  margin: 6px 0 0 0;
  color: #666;
  font-size: 12px;
  line-height: 1.4;
}

/* Modal Footer */
.modal-footer {
  padding: 15px 20px;
  background-color: #f5f5f5;
  border-top: 1px solid #e0e0e0;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.modal-footer .button {
  padding: 8px 15px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.2s;
  text-transform: none;
}

.modal-footer .button.default {
  background-color: #007cba;
  color: #fff;
}

.modal-footer .button.default:hover {
  background-color: #2b5468;
}

.modal-footer .button.cancel {
  background-color: #fff;
  color: #333;
  border: 1px solid #ccc;
}

.modal-footer .button.cancel:hover {
  background-color: #f5f5f5;
  border-color: #999;
}

/* Animation */
.modal[style*="display: block"] .modal-dialog {
  animation: slideDown 0.3s ease-out;
}

@keyframes slideDown {
  from {
    transform: translateY(-50px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

/* Responsive */
@media (max-width: 768px) {
  .modal-dialog {
    margin: 50px 20px;
    width: calc(100% - 40px);
  }
  
  .modal-footer {
    flex-direction: column;
  }
  
  .modal-footer .button {
    width: 100%;
  }
}
</style>

<div id="scheduleModal" class="modal" style="display:none;">
  <div class="modal-overlay"></div>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Schedule Execution</h2>
        <button type="button" class="close" id="closeModalX">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <div class="form-group">
            <label for="scheduleDateTime" class="required">Select Date & Time:</label>
            <input type="datetime-local" id="scheduleDateTime" name="schedule_datetime" class="vDateTimeField" required>
            <p class="error-message" id="datetimeError" style="display:none;">
              <span class="error-icon">⚠</span> Please select a date and time.
            </p>
            <p class="help">Choose when you want to execute this test suite.</p>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="confirmSchedule" type="button" class="button default">Schedule</button>
        <button id="closeModal" type="button" class="button cancel">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const modal = document.getElementById('scheduleModal');
    const openBtns = document.querySelectorAll('.schedule-btn');
    const closeBtn = document.getElementById('closeModal');
    const closeXBtn = document.getElementById('closeModalX');
    const confirmBtn = document.getElementById('confirmSchedule');
    const overlay = document.querySelector('.modal-overlay');
    const datetimeInput = document.getElementById('scheduleDateTime');
    const errorMsg = document.getElementById('datetimeError');
    
    if (!openBtns.length) return;

    // // Set minimum datetime to current time
    // function setMinDateTime() {
    //     const now = new Date();
    //     now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    //     datetimeInput.min = now.toISOString().slice(0, 16);
    // }
    
    // setMinDateTime();

    // Open modal - attach to ALL schedule buttons
    openBtns.forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            console.log("Schedule button clicked");
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
            // Clear any previous error
            hideError();
        });
    });

    // Show error function
    function showError(message) {
        errorMsg.textContent = message;
        errorMsg.style.display = 'flex';
        datetimeInput.classList.add('error');
        datetimeInput.focus();
    }

    // Hide error function
    function hideError() {
        errorMsg.style.display = 'none';
        datetimeInput.classList.remove('error');
        datetimeInput.value = '';
    }

    // Clear error on input change
    // datetimeInput.addEventListener('input', function() {
    //     if (this.value) {
    //         hideError();
    //     }
    // });

    // Close modal function
    function closeModal() {
        modal.style.display = 'none';
        document.body.style.overflow = '';
        hideError();
    }

    function syncFilteredSelects() {
      if (typeof django !== "undefined" && django.jQuery) {
          // Copy selected options from the right box to the original select
          django.jQuery("select[multiple].filtered").each(function() {
              const select = django.jQuery(this);
              select.find("option").prop("selected", true);
          });
      }
    }
    // Close button handlers
    closeBtn.addEventListener('click', closeModal);
    closeXBtn.addEventListener('click', closeModal);
    
    // Close on overlay click
    if (overlay) {
        overlay.addEventListener('click', closeModal);
    }

    // Close on ESC key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && modal.style.display === 'block') {
            closeModal();
        }
    });

    // Confirm button
    confirmBtn.addEventListener('click', function() {
        const datetime = datetimeInput.value;
        
        // Validation
        if (!datetime) {
            showError('⚠ Please select a date and time.');
            return;
        }

        // Check if datetime is in the future
        const selectedDate = new Date(datetime);
        const now = new Date();
        
        if (selectedDate <= now) {
            showError('⚠ Please select a future date and time.');
            return;
        }

        // Select the main Django admin form
        const form = document.getElementById('testsuiteexecution_form') || 
                     document.querySelector('form#testsuiteexecution_form') ||
                     document.querySelector('form[method="post"]');
        
        if (!form) {
            console.error('Could not find the admin form');
            showError('⚠ Error: Could not find form. Please refresh the page.');
            return;
        }

        console.log("Form found:", form);

        // Store the original action
        const originalAction = form.action;

        // Create hidden inputs
        const hiddenInput = document.createElement('input');
        hiddenInput.type = 'hidden';
        hiddenInput.name = '_schedule_execution';
        hiddenInput.value = 'true';
        form.appendChild(hiddenInput);

        const dtField = document.createElement('input');
        dtField.type = 'hidden';
        dtField.name = 'schedule_datetime';
        dtField.value = datetime;
        form.appendChild(dtField);

        // Ensure form action hasn't changed
        if (!form.action || form.action.includes('logout')) {
            form.action = originalAction;
        }

        console.log("Submitting form with scheduled datetime:", datetime);
        syncFilteredSelects();
        closeModal();
        form.submit();
    });
});
</script>
