# NOTE: This Docker image is for production purposes only.

services:
  controller:
    build:
      context: .
    image: openwisp/controller-production:latest
    environment:
      - REDIS_URL=redis://redis:6379
    ports:
      - 8000:8000
    depends_on:
      - redis
      - postgres
      - influxdb
    command: |
      sh -c "
      python manage.py migrate --no-input &&
      python manage.py shell <<EOF
      from django.contrib.auth import get_user_model
      User = get_user_model()
      if not User.objects.filter(username='admin').exists():
          User.objects.create_superuser('admin', 'admin@example.com', 'admin')
      else:
          print('User \"admin\" exists already, not created')
      EOF
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - /var/log/openwisp:/var/log/openwisp  # Logging path
      - media_data:/opt/openwisp/media
      - firmware_data:/opt/openwisp/private/firmware

  celery-worker:
    image: openwisp/controller-production:latest
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - postgres
      - influxdb
      - controller
    command: celery -A openwisp2 worker -l info
    volumes:
      - /var/log/openwisp:/var/log/openwisp   # Logging path
      - media_data:/opt/openwisp/media
      - firmware_data:/opt/openwisp/private/firmware

  celery-beat:
    image: openwisp/controller-production:latest
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - postgres
      - influxdb
      - controller
    command: celery -A openwisp2 beat -l info --schedule /opt/openwisp/tests/openwisp2/celerybeat-schedule
    volumes:
      - /var/log/openwisp:/var/log/openwisp    # Logging path
      - media_data:/opt/openwisp/media
      - firmware_data:/opt/openwisp/private/firmware

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    entrypoint: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_PASSWORD: openwisp2
      POSTGRES_USER: openwisp2
      POSTGRES_DB: openwisp2
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  influxdb:
    image: influxdb:1.8-alpine
    volumes:
      - influxdb-data:/var/lib/influxdb
      - ./tests/influxdb.conf:/etc/influxdb/influxdb.conf
    ports:
      - "8086:8086"
      - "8089:8089/udp"
      - "8090:8090/udp"
      - "8091:8091/udp"
      - "8092:8092/udp"
    environment:
      INFLUXDB_DB: openwisp2
      INFLUXDB_USER: openwisp
      INFLUXDB_USER_PASSWORD: openwisp

volumes:
  redis_data:
  postgres_data:
  influxdb-data:
  logs:
  media_data:
  firmware_data:
