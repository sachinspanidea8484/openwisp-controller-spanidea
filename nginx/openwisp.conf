server {
    listen 80;
    server_name 44.193.103.240 localhost 127.0.0.1;

    client_max_body_size 500M;

    # --- Protected test case folders ---
    # Routes /media/test_case/* and /media/test_case_robot/* to Django
    # Django validates the Bearer token and streams the file
    location ~ ^/media/(test_case|test_case_robot)/ {
        proxy_pass http://controller:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        # Forward Authorization header so Django can read the Bearer token
        proxy_set_header Authorization $http_authorization;
    }

    # --- Everything else (including all other /media/ files) ---
    location / {
        proxy_pass http://controller:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
    }
}